# =============================================================================
# Thế giới mô phỏng: bể nước giống bể bơi. Mặt nước ở z = 0.
# Robot xuất phát ở gốc (0, 0), mũi hướng +x (hướng "Đông" trong ENU).
# Các vật thể đặt lệch sang hai bên / phía sau để không cản đường test tự động.
# =============================================================================
world:
  name: cps5_pool
  step_size: 0.001        # s — bước vật lý 1 ms (ArduPilot lock-step)
  real_time_factor: 1.0

pool:
  length: 10.0            # m, theo x
  width: 5.0              # m, theo y
  depth: 3.0              # m
  wall_thickness: 0.1

# Vật thể có màu, dùng để thử nhận diện bằng camera.
objects:
  buoy:      {type: sphere, radius: 0.15, xyz: [-3.0,  1.5, -1.0], color: [1.0, 0.45, 0.0]}
  red_box:   {type: box, size: [0.3, 0.3, 0.3], xyz: [-2.0, -1.5, -2.85], color: [0.9, 0.1, 0.1]}
  gate_left: {type: cylinder, radius: 0.03, length: 1.5, xyz: [-4.2,  0.6, -2.25], color: [1.0, 0.9, 0.0]}
  gate_right: {type: cylinder, radius: 0.03, length: 1.5, xyz: [-4.2, -0.6, -2.25], color: [1.0, 0.9, 0.0]}
