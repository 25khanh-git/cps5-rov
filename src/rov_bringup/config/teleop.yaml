# Ánh xạ tay cầm -> kênh RC của ArduSub. Quy ước joy của ROS: cần đẩy lên / sang trái = +1.
# Với tay cầm khác loại: chạy  ros2 topic echo /joy , xem trục/nút nào thay đổi, rồi sửa index/sign bên dưới.
# keyboard_teleop phát /joy theo đúng bố cục mặc định này.
teleop_node:
  ros__parameters:
    rate_hz: 20.0           # Hz gửi /mavros/rc/override (phải nhanh hơn nhiều so với FS_PILOT_TIMEOUT)
    joy_timeout: 0.5        # s không có /joy -> gửi trung tính
    pwm_range: 400          # 1500 ± 400 => 1100..1900
    gain_default: 0.5       # giới hạn biên độ (0.1..1.0)
    gain_step: 0.1
    deadzone: 0.05
    arm_requires_neutral: true   # chỉ ARM khi cần ga/tiến ở giữa

    # Trục: index trong msg.axes, sign = +1/-1
    # forward : đẩy cần trái lên  -> tiến       (kênh 5)
    # lateral : cần trái sang phải -> sang phải (kênh 6)  [joy: trái = +1 nên sign = -1]
    # yaw     : cần phải sang phải -> quay phải (kênh 4)  [sign = -1]
    # throttle: cần phải lên        -> nổi lên  (kênh 3)
    axis_forward: 1
    sign_forward: 1.0
    axis_lateral: 0
    sign_lateral: -1.0
    axis_yaw: 2
    sign_yaw: -1.0
    axis_throttle: 3
    sign_throttle: 1.0

    # Nút (bố cục SDL GameController mà joy_node của Humble dùng):
    # 0 A/Cross, 1 B/Circle, 3 Y/Triangle, 4 Back/Share, 6 Start/Options, 9 L1, 10 R1
    button_arm: 6
    button_disarm: 4
    button_manual: 0
    button_stabilize: 1
    button_alt_hold: 3
    button_gain_down: 9
    button_gain_up: 10
