# =============================================================================
# CPS5 — Thông số vật lý của robot dùng cho sim (đơn vị SI: m, kg, N, s, rad)
#
# Mọi thông số vật lý của sim chỉ nằm trong file này. Khi có số đo thật, sửa ở đây
# và cập nhật bảng "Trạng thái số liệu" trong README.
# Sau khi sửa: chạy lại sim (file SDF được sinh lại tự động mỗi lần chạy).
# Xem nhanh các con số suy ra (thể tích, lực nổi...):  bash scripts/generate_sdf.sh
#
# Hệ trục robot (chuẩn ROS REP-103): x = hướng mũi, y = sang trái, z = lên.
# Gốc tọa độ base_link = tâm của hộp nổi (tâm nổi).
# =============================================================================

vehicle:
  name: cps5
  # Tổng khối lượng (kg). Giá trị tạm: 7 kg (riêng 8 x T200 đã ~2.8 kg). Cần cân robot thật.
  mass: 7.0
  # Lực nổi lớn hơn trọng lượng bao nhiêu phần (0.015 = 1.5 %).
  # Dương => robot tự nổi khi thả tay (an toàn). Âm => robot chìm.
  buoyancy_margin: 0.015
  # Khoảng cách tâm nổi cao hơn trọng tâm (m). Ống kín (nổi) ở trên, thruster + khung (nặng) ở dưới.
  # Giá trị ước lượng; cần đo lại khi thử robot trong nước.
  cob_above_com: 0.020
  # Mô-men quán tính quanh trọng tâm (kg·m²). Ước lượng: xấp xỉ hình hộp 0.45 x 0.40 x 0.15 m,
  # nhân hệ số 0.6 vì khối lượng tập trung ở giữa (ống + pin).
  inertia: {ixx: 0.065, iyy: 0.080, izz: 0.130}
  # Vị trí thả robot trong thế giới (z = 0 là mặt nước, âm là dưới nước).
  # Thả sát mặt nước để ArduSub hiệu chuẩn cảm biến độ sâu ở mức ~0 m khi khởi động.
  spawn: {x: 0.0, y: 0.0, z: -0.05, yaw: 0.0}

water:
  # Nước ngọt ~997 kg/m³; nước biển ~1025 kg/m³.
  density: 997.0

# Hộp va chạm (collision) dùng để tính lực nổi. Plugin Buoyancy của Gazebo tính lực nổi theo
# thể tích collision, nên chiều cao hộp được sinh tự động sao cho:
#   thể tích = mass * (1 + buoyancy_margin) / density
hull:
  length: 0.40   # m, theo trục x (khung trong CAD, không tính nozzle)
  width: 0.30    # m, theo trục y

# Chỉ dùng để hiển thị (không ảnh hưởng vật lý).
visual:
  tube_radius: 0.040    # ống acrylic 80 mm
  tube_length: 0.30     # dài ~300 mm

# Khối lượng nước kèm (added mass), đơn vị kg và kg·m², luôn là số dương.
# Khai báo bằng <fluid_added_mass> của SDF (ổn định số với DART trên Gazebo Harmonic).
# Giá trị ước lượng, lấy theo mô hình BlueROV2 Heavy (cùng cỡ, 8 thruster) trong ardupilot_gazebo.
# Hướng z lớn nhất vì mặt trên/dưới của robot rộng nhất.
added_mass:
  enabled: true
  xx: 1.70
  yy: 2.50
  zz: 5.50
  pp: 0.02
  qq: 0.05
  rr: 0.05

# Hệ số cản thủy động (mô hình Fossen), luôn là số âm. Lực cản = linear*v + quadratic*v*|v|.
# Giá trị lấy theo BlueROV2 Heavy của ardupilot_gazebo. Có thể hiệu chỉnh từ dữ liệu ros2 bag ghi ở bể bơi.
drag:
  linear:    {x: -4.0, y: -6.2, z: -5.2, k: -0.07, m: -0.07, n: -0.07}
  quadratic: {x: -18.2, y: -21.7, z: -37.0, k: -1.55, m: -1.55, n: -1.55}

thrusters:
  # Blue Robotics T200 ở pin 3S (~12 V): ~36 N chiều thuận, ~28 N chiều ngược.
  # Plugin chỉ nhận một giá trị cho cả hai chiều nên lấy ~30 N. Cần đo lại bằng cân treo.
  max_thrust: 30.0
  propeller_diameter: 0.076  # m (T200)
  thrust_coefficient: 0.02   # chỉ để tính tốc độ quay cánh
  prop_mass: 0.005           # kg mỗi cánh (được trừ ra khỏi khối lượng thân)
  # Thứ tự trong danh sách = SERVO1..8 của ArduSub (frame Vectored-6DOF, FRAME_CONFIG = 2).
  # Đổi thứ tự sẽ làm sai motor; unit test test_model.py kiểm tra điều này.
  # Hệ số từ source ArduSub (AP_Motors6DOF.cpp, Sub-4.7.2), (roll, pitch, yaw, throttle, forward, lateral):
  #   M1 ( 0, 0, 1, 0,-1, 1) ngang, trước-phải   M5 ( 1,-1, 0,-1, 0, 0) đứng, trước-phải
  #   M2 ( 0, 0,-1, 0,-1,-1) ngang, trước-trái   M6 (-1,-1, 0,-1, 0, 0) đứng, trước-trái
  #   M3 ( 0, 0,-1, 0, 1, 1) ngang, sau-phải     M7 ( 1, 1, 0,-1, 0, 0) đứng, sau-phải
  #   M4 ( 0, 0, 1, 0, 1,-1) ngang, sau-trái     M8 (-1, 1, 0,-1, 0, 0) đứng, sau-trái
  # Vị trí lấy từ CAD Onshape "one tube 8 thruster layout assembly" (tâm khung làm gốc).
  # Đổi trục CAD -> robot: x = +Z_cad (mũi), y = -X_cad (trái), z = -Y_cad (lên).
  # axis = hướng lực khi PWM > 1500, trong hệ trục robot.
  # spin = chiều quay cánh (±1), chỉ để cân mô-men phản lực giữa các cánh.
  list:
    - {name: thruster1, xyz: [ 0.188, -0.155, -0.040], axis: [-0.7071068, -0.7071068, 0], spin: 1}   # CAD T200 <8>
    - {name: thruster2, xyz: [ 0.188,  0.155, -0.040], axis: [-0.7071068,  0.7071068, 0], spin: -1}  # CAD T200 <5>
    - {name: thruster3, xyz: [-0.188, -0.155, -0.040], axis: [ 0.7071068, -0.7071068, 0], spin: -1}  # CAD T200 <7>
    - {name: thruster4, xyz: [-0.188,  0.155, -0.040], axis: [ 0.7071068,  0.7071068, 0], spin: 1}   # CAD T200 <6>
    - {name: thruster5, xyz: [ 0.0685, -0.091, -0.045], axis: [0, 0, -1], spin: 1}                    # CAD T200 <1>
    - {name: thruster6, xyz: [ 0.0685,  0.091, -0.045], axis: [0, 0, -1], spin: -1}                   # CAD T200 <4>
    - {name: thruster7, xyz: [-0.0685, -0.091, -0.045], axis: [0, 0, -1], spin: -1}                   # CAD T200 <2>
    - {name: thruster8, xyz: [-0.0685,  0.091, -0.045], axis: [0, 0, -1], spin: 1}                    # CAD T200 <3>

camera:
  enabled: true
  xyz: [0.17, 0.0, 0.0]   # sau vòm acrylic phía trước (camera mount trong CAD)
  hfov: 1.57              # rad (~90°)
  width: 640
  height: 480
  rate: 15                # Hz

imu:
  rate: 1000              # Hz — ArduPilotPlugin đọc IMU này để gửi cho SITL
